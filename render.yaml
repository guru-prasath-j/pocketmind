# Render Blueprint: deploys the PocketMind landing page (site/) as a static
# site. PocketMind itself is a native mobile app (on-device AI), so the web
# presence is this landing page.
services:
  - type: web
    name: pocketmind
    runtime: static
    buildCommand: echo "Static landing page, no build step"
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
